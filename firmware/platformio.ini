[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.4.1
    lvgl/lvgl@^8.3.9
    esphome/ESP32-audioI2S@^2.1.0

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=20000000
    -D LV_CONF_SKIP=1
    -D LV_TICK_CUSTOM=1
    -D LV_TICK_CUSTOM_INCLUDE=\"Arduino.h\"
    -D LV_TICK_CUSTOM_SYS_TIME_EXPR=millis\(\)
    -D LV_COLOR_DEPTH=16
    -D LV_COLOR_16_SWAP=0
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_USE_BAR=1
    -D LV_USE_LABEL=1
    -D LV_USE_BTN=1
